name: Upstream Sync

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check & Sync Upstream HA Core Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Upstream Portainer Commits
        id: diff_check
        run: |
          CURRENT_SHA=$(tr -d '[:space:]' < .upstream_sha 2>/dev/null || echo "")
          LATEST_SHA=$(curl -s "https://api.github.com/repos/home-assistant/core/commits?path=homeassistant/components/portainer&per_page=1" | jq -r '.[0].sha')
          echo "Tracked upstream SHA: $CURRENT_SHA"
          echo "Latest upstream SHA:  $LATEST_SHA"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "null" ] && [ "$LATEST_SHA" != "$CURRENT_SHA" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$LATEST_SHA" > .upstream_sha
            # Sync non-forked upstream files automatically
            for file in diagnostics.py system_health.py quality_scale.yaml icons.json services.yaml; do
              curl -s -f -o "custom_components/portainer/$file" \
                "https://raw.githubusercontent.com/home-assistant/core/dev/homeassistant/components/portainer/$file" || true
            done
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Upstream Pull Request
        if: steps.diff_check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(upstream): sync latest changes from home-assistant/core"
          title: "chore(upstream): upstream Home Assistant updates detected"
          body: |
            New changes were detected in the upstream `homeassistant/components/portainer` integration from `home-assistant/core:dev`.

            ### Automated Verification Pipeline
            This PR automatically runs the CI test suite:
            - **Hassfest**: Manifest, services, and translation schema validation
            - **HACS Action**: Integration structure & compatibility
            - **Ruff & PyCompile**: Static analysis and Python syntax checks
            - **Pytest**: Integration tests verifying custom options flow, endpoint filtering, and unique ID stability

            **Review the CI status checks below before merging:**
            - **Passed**: Upstream updates are verified safe and compatible with custom filters.
            - **Failed**: Upstream updates introduced breaking changes. Inspect logs before merging.
          branch: "upstream-sync"
          delete-branch: true
